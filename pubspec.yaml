name: budgetbox
description: "Krish's book — a personal life ledger. Home-cooked, local-first."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  share_plus: ^12.0.1
  flutter_local_notifications: ^19.0.0
  flutter_timezone: ^4.0.0
  timezone: ^0.10.0
  cryptography: ^2.9.0
  http: ^1.5.0
  connectivity_plus: ^7.0.0
  lottie: ^3.5.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  assets:
    - assets/kural/kural.json
    - assets/calendar/holidays.json
    - assets/animation/
  uses-material-design: true

  fonts:
    - family: Absans
      fonts:
        - asset: assets/fonts/Absans-Regular.otf
    - family: Subjectivity
      fonts:
        - asset: assets/fonts/Subjectivity-Regular.otf
        - asset: assets/fonts/Subjectivity-Medium.otf
          weight: 500
        - asset: assets/fonts/Subjectivity-Bold.otf
          weight: 700
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/SplineSansMono.ttf
