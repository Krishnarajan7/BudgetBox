name: budgetbox
description: "Krish's book — a personal life ledger. Home-cooked, local-first."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  local_auth: ^3.0.2
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/SplineSansMono.ttf
