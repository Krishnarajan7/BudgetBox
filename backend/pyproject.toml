[project]
name = "budgetbox"
version = "0.1.0"
description = "BudgetBox backend — single-user personal ledger, source of truth."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "typer>=0.15",
    "uuid6>=2024.7.10",
]

[project.scripts]
budgetbox = "budgetbox.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=0.1",
    "time-machine>=2.16",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budgetbox"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",
    "DTZ",           # naive-datetime bans: day-boundary bugs are the enemy
    "T20",           # no stray print (CLI uses typer.echo)
]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]  # tests pin naive fixtures deliberately via time-machine
"deploy/**" = ["T201"]  # deploy/backup scripts talk to a terminal on purpose

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# FastAPI/SQLAlchemy register functions via decorators; "unused" is the working style.
reportUnusedFunction = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
